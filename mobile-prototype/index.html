<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Delivery System — Mobile Prototype</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="prototype-stage">
    <aside class="prototype-panel" aria-label="أدوات النموذج">
      <div>
        <span class="eyebrow">CODE-FIRST PROTOTYPE</span>
        <h1>Delivery System</h1>
        <p>نموذج تفاعلي لتطبيق السائق، مبني مباشرة من وثيقة المتطلبات ونظام التصميم.</p>
      </div>
      <nav class="screen-picker" id="screenPicker" aria-label="شاشات النموذج"></nav>
      <div class="preview-tools">
        <strong>حالة المعاينة</strong>
        <div class="preview-state-picker" id="previewStatePicker" aria-label="حالات الواجهة"></div>
        <button class="offline-toggle" id="offlineToggle" type="button">محاكاة فقدان الاتصال</button>
      </div>
      <div class="panel-note">
        <strong>390 × 844</strong>
        <span>Arabic RTL · local assets · reusable components</span>
      </div>
    </aside>

    <section class="device-wrap" aria-label="معاينة الهاتف">
      <div class="device" id="device">
        <div class="device-speaker" aria-hidden="true"></div>
        <div id="app" class="app-shell" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script src="js/app.js" defer></script>
</body>
</html>
